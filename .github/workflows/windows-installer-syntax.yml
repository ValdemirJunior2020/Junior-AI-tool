name: Windows Installer Syntax
on:
  push:
    paths:
      - 'SETUP-OPENHANDS-LOCAL.ps1'
      - '.github/workflows/windows-installer-syntax.yml'
  pull_request:
    paths:
      - 'SETUP-OPENHANDS-LOCAL.ps1'
      - '.github/workflows/windows-installer-syntax.yml'
jobs:
  check-powershell-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax without executing installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\SETUP-OPENHANDS-LOCAL.ps1').Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host 'PowerShell syntax OK.'
